# Starts the app from clean and goes in.
#   ENV       mock | dev
#   IDENTITY  login | visitor | stay (stay on the login screen)
#   API_KEY, FORM_ID   only for dev
#   SECRET    a secure test key's secret (dev, optional)
#   SESSION   yes when that key has a session time
#   SIGNATURE none | valid | wrong
#   TRACK_ROOT yes to turn on the navigator observer's trackRootRoute
#   VISITOR_AUTOSTART no to turn off the provider's autoStartVisitorSession
#   PERSIST_USER no to turn off the config's persistUserAcrossRestarts
# The runner passes every one of these on each call. Defaults are not set
# here: a default in the flow file wins over a value passed on the command line.
appId: com.encatch.fluttere2e
---
- launchApp:
    clearState: true
- runFlow:
    when:
      true: ${ENV == 'dev'}
    commands:
      - tapOn:
          id: "env-dev"
      - tapOn:
          id: "setup-api-key"
      - inputText: ${API_KEY}
      # Enter closes the keyboard. Maestro's hideKeyboard does not work in
      # this app on iOS.
      - pressKey: Enter
      - tapOn:
          id: "setup-form-id"
      - inputText: ${FORM_ID}
      # Enter closes the keyboard. Maestro's hideKeyboard does not work in
      # this app on iOS.
      - pressKey: Enter
- runFlow:
    when:
      true: ${SECRET != ''}
    commands:
      - tapOn:
          id: "setup-secret"
      - inputText: ${SECRET}
      # Enter closes the keyboard. Maestro's hideKeyboard does not work in
      # this app on iOS.
      - pressKey: Enter
- runFlow:
    when:
      true: ${SESSION == 'yes'}
    commands:
      - tapOn:
          id: "setup-session-time"
- runFlow:
    when:
      true: ${TRACK_ROOT == 'yes'}
    commands:
      - tapOn:
          id: "setup-track-root"
- runFlow:
    when:
      true: ${VISITOR_AUTOSTART == 'no'}
    commands:
      - tapOn:
          id: "setup-auto-start-visitor"
- runFlow:
    when:
      true: ${PERSIST_USER == 'no'}
    commands:
      - tapOn:
          id: "setup-persist-user"
- tapOn:
    id: "setup-start"
- runFlow:
    when:
      true: ${IDENTITY == 'visitor'}
    commands:
      - tapOn:
          id: "visitor-button"
- runFlow:
    when:
      true: ${IDENTITY == 'login'}
    commands:
      - tapOn:
          id: "sig-${SIGNATURE}"
      - tapOn:
          id: "login-button"
- runFlow:
    when:
      true: ${IDENTITY == 'stay'}
    commands:
      - assertVisible:
          id: "login-button"
- runFlow:
    when:
      true: ${IDENTITY != 'stay'}
    commands:
      - assertVisible:
          id: "tab-home"
