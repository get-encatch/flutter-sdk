# Spike: can Maestro open the survey, see inside its WebView and close it?
# Mock environment (this repo's mock on port 8797 must be running).
#
#   maestro --device <serial or udid> test e2e/flows/spike-survey.yaml
#
# Always pass --device: another Maestro run may be using a different device.
appId: com.encatch.fluttere2e
---
- launchApp:
    clearState: true
- tapOn:
    id: "setup-start"
- tapOn:
    id: "login-button"
- tapOn:
    id: "tab-events"
- tapOn:
    id: "show-form"
- extendedWaitUntil:
    visible: "Submit"
    timeout: 20000
- assertVisible: "How would you rate the app.*"
- tapOn: "Close"
- assertNotVisible: "Submit"
