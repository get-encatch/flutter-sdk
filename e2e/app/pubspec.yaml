name: fluttere2e
description: "End-to-end test app for the Encatch Flutter SDK. Not published."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  crypto: ^3.0.3
  encatch_flutter:
    path: ../../
  flutter:
    sdk: flutter
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^6.0.0

# device_info_plus 13.3.0 uses an Apple API that Xcode 26.0 does not have
# (NSProcessInfo.isiOSAppOnVision), so the iOS build fails there. Pin the last
# 12.x for this test app only; the SDK itself allows 12.3.0 up to 14.
dependency_overrides:
  device_info_plus: 12.3.0

flutter:
  uses-material-design: true
