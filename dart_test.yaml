# Tests tagged `pending-fix` describe behaviour the SDK does not have yet. Each
# one fails on the current code on purpose and is skipped by default, so the
# normal test run stays green. A fix removes the tag from the tests it makes
# pass. To see them fail:
#
#   flutter test --run-skipped --tags pending-fix
tags:
  pending-fix:
    skip: "Describes a fix that has not landed yet. Run with --run-skipped --tags pending-fix."
  # Runs over real HTTP against this repo's mock API (e2e/mock-api) on port
  # 8797, which must be started first. See test/mock/mock_api_test.dart.
  mock:
    skip: "Needs the mock API on port 8797. Run with --run-skipped --tags mock."
